allprojects {
    repositories {
        google()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.google.com" }
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Some transitive dependencies (e.g. unifiedpush_android) ship a Kotlin
// languageVersion older than the project's Kotlin Gradle plugin supports.
// Force a minimum supported language version across all modules.
//
// This was pinned to 1.8 when the fork was on Kotlin 2.0. Under Kotlin 2.2 that
// pin also applied to the app's own sources and rejected `..<` and enum entries,
// so it is now 2.0 — the oldest version Kotlin 2.2 still accepts.
subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0)
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

